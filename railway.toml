# Railway config-as-code: https://docs.railway.com/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# The iOS app lives in the same repo: only server/web changes trigger a deploy.
watchPatterns = [
  "app/**",
  "alembic/**",
  "alembic.ini",
  "web/**",
  "pyproject.toml",
  "uv.lock",
  "Dockerfile",
  ".dockerignore",
  "railway.toml",
]

[deploy]
# Apply database migrations before the new version starts taking traffic.
# If they fail, the deploy stops and the previous version keeps running.
preDeployCommand = ["alembic upgrade head"]
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
