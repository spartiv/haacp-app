# Railway config-as-code: https://docs.railway.com/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# The iOS app lives in the same repo: only server/web changes trigger a deploy.
watchPatterns = [
  "app/**",
  "alembic/**",
  "alembic.ini",
  "web/**",
  "pyproject.toml",
  "uv.lock",
  "Dockerfile",
  ".dockerignore",
  "railway.toml",
]

[deploy]
# Database migrations run in the container's start command (see Dockerfile),
# so they happen on every deploy regardless of how this file is applied.
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
